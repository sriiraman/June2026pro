trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: SonarQubePrepare@7
  inputs:
    SonarQube: 'Sonarqube'
    scannerMode: 'Other'

- task: Maven@4
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean verify sonar:sonar'

- task: SonarQubePublish@7
  inputs:
    pollingTimeoutSec: '300'